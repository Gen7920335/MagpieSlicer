# Copy this folder into the mod index repository. On every push to main the index is rebuilt
# from mods/ and committed, so index.json always carries the hashes of the files it serves.
name: Build mod index
on:
  push:
    branches: [main]
    paths: ['mods/**', 'build_index.py']
  pull_request:
    paths: ['mods/**', 'build_index.py']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate mods
        run: python build_index.py --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main" --check
      - name: Build index.json
        if: github.event_name == 'push'
        run: python build_index.py --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main"
      - name: Commit index.json
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index.json"
            git push
          fi
